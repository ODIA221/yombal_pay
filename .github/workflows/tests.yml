# Tests de bout en bout à chaque push et pull request (mode démo, PostgreSQL éphémère)
name: Tests

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yombal_pay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - run: npm ci --prefix server --no-audit --no-fund
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm ci --prefix shop --no-audit --no-fund
      - run: npm run build --prefix web
      - run: node scripts/e2e.mjs
